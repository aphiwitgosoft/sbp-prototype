<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างเอกสาร · SBP Management System</title>
<link rel="stylesheet" href="assets/sbp.css">
<style>
  /* การ์ดขาวว่าง ๆ ขนาดพอ ๆ กับฟอร์มสร้างเอกสารเดิม — ไม่มีฟอร์ม/แท็บ (ตัดสินใจ 2026-08-06)
     ต้องใช้คลาส .card ด้วย เพราะ revealOnLoad() ใน sbp.js เติม .in ให้เฉพาะ .stat/.mod-card/.card/.flow-phase */
  .fs-stage{min-height:560px; display:flex; align-items:center; justify-content:center; padding:60px 48px; margin:0;}
  .fs-msg{max-width:980px; text-align:center;}
  .fs-msg h2{font-size:28px; line-height:1.6; font-weight:600; color:#1f2733; margin:0 0 18px; letter-spacing:-.3px;}
  .fs-msg h2 b{color:var(--primary); font-weight:600;}
  .fs-msg p{font-size:19px; line-height:1.7; color:#5d6b7a; margin:0;}
  .fs-msg small{display:block; margin-top:34px; font-size:13px; line-height:1.9; color:#9aa7b6;}
  @media (max-width:820px){
    .fs-stage{padding:44px 22px; min-height:420px;}
    .fs-msg h2{font-size:20px;} .fs-msg p{font-size:15.5px;} .fs-msg small{margin-top:26px;}
  }
</style>
</head>
<body data-page="k2-create" data-nav="modules" data-module="k2-create" data-crumb="สร้างเอกสาร">
  <div class="layout">
    <aside id="sidebar"></aside>
    <main class="content">

      <div class="page-head">
        <div><h1 class="page-title">สร้างเอกสารประกันรายได้</h1></div>
      </div>

      <section class="card fs-stage">
        <div class="fs-msg">
          <h2>ใช้ form สร้างข้อมูลต้นทางที่ระบบ <b>Finance &amp; Account Unit (FS)</b></h2>
          <p>ระบบประกันรายได้รับข้อมูลกลับมาสร้างเอกสารให้อัตโนมัติ</p>
          <small>รอกระบวนการ SBP Statement ประมวลผลและส่งข้อมูลกลับ ประมาณ 1 วัน · เฉพาะผู้มีสิทธิ์เข้าถึงเท่านั้น</small>
        </div>
      </section>

    </main>
  </div>
  <div id="toast-stack"></div>
  <script src="assets/sbp.js"></script>
</body>
</html>
