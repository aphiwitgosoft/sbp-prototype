<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 724" width="1420" height="724" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif"><defs><marker id="arg" markerWidth="10" markerHeight="10" refX="7.2" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.2,3.2 L0,6.4 Z" fill="#64748b"/></marker><marker id="arv" markerWidth="10" markerHeight="10" refX="7.2" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.2,3.2 L0,6.4 Z" fill="#7c3aed"/></marker><marker id="ara" markerWidth="10" markerHeight="10" refX="7.2" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.2,3.2 L0,6.4 Z" fill="#f59e0b"/></marker><marker id="arr" markerWidth="10" markerHeight="10" refX="7.2" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.2,3.2 L0,6.4 Z" fill="#dc2626"/></marker><marker id="arb" markerWidth="10" markerHeight="10" refX="7.2" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.2,3.2 L0,6.4 Z" fill="#2f6fed"/></marker><marker id="arn" markerWidth="10" markerHeight="10" refX="7.2" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.2,3.2 L0,6.4 Z" fill="#16a34a"/></marker><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs><rect x="0" y="0" width="1420" height="724" fill="#ffffff"/><rect x="0" y="0" width="1420" height="62" fill="#0f172a"/><text x="28" y="33" text-anchor="start" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="19" fill="#fff" font-weight="700">หยุดชดเชย vs เห็นควรไม่ชดเชย — พฤติกรรมหน้ารายการต่างกันคนละแบบ</text><text x="28" y="52" text-anchor="start" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.8" fill="#94a3b8" font-weight="400">SDD สไลด์ 46 ข้อ 1.9 · สไลด์ 48 · 64 — สองปุ่มนี้จบเอกสารเหมือนกัน แต่การแสดงผลตรงข้ามกัน</text><g transform="translate(0,34)"><rect x="150.0" y="122.0" width="300" height="86" rx="12" fill="#eef4ff" stroke="#2f6fed" stroke-width="1.7" filter="url(#sh)"/><text x="316" y="161.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="13.5" fill="#1f2937" font-weight="700">ฝ่าย SBP DSA พิจารณา</text><text x="316" y="178.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">เอกสารเดือนปัจจุบัน</text><circle cx="176.0" cy="165" r="15" fill="#2f6fed"/><text x="176.0" y="169.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#fff" font-weight="700">06</text><polygon points="660,103 780,165 660,227 540,165" fill="#fff8ea" stroke="#f59e0b" stroke-width="1.7" filter="url(#sh)"/><text x="660" y="169" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#92400e" font-weight="700">กดปุ่มไหน ?</text><path d="M450,165 L540,165" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#arg)"/><path d="M660,103 L660,70 L1010,70 L1010,110" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#arr)"/><text x="835" y="60" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11" fill="#dc2626" font-weight="600">หยุดชดเชยประกันรายได้</text><rect x="880.0" y="110.0" width="480" height="80" rx="10" fill="#fdecec" stroke="#dc2626" stroke-width="1.7" filter="url(#sh)"/><text x="1120" y="139.0" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="13.5" fill="#1f2937" font-weight="700">เอกสารจบ (เสร็จสิ้นดำเนินการ)</text><text x="1120" y="156.0" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">แต่ กลับมาแสดงในหน้ารอดำเนินการของ 06 ทันทีในเดือนนั้น</text><text x="1120" y="170.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">ชิป ↺ หยุดชดเชยฯ · เห็นเฉพาะบทบาท 06 · เปิดพิจารณาใหม่ได้เอง (ไม่ต้องเปิด SR)</text><path d="M1120,190 L1120,255 L300,255 L300,208" fill="none" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="860" y="246" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#dc2626" font-weight="600">กลับเข้าคิวของ 06 ทันที — เดือนเดียวกัน</text><path d="M660,227 L660,330 L880,330" fill="none" stroke="#b45309" stroke-width="1.9" marker-end="url(#ara)"/><text x="672" y="320" text-anchor="start" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11" fill="#b45309" font-weight="600">เห็นควรไม่ชดเชยรายได้</text><rect x="880.0" y="290.0" width="480" height="80" rx="10" fill="#fff8ea" stroke="#f59e0b" stroke-width="1.7" filter="url(#sh)"/><text x="1120" y="319.0" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="13.5" fill="#1f2937" font-weight="700">เอกสารจบ (เสร็จสิ้นดำเนินการ)</text><text x="1120" y="336.0" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">ไม่แสดง ในหน้ารอดำเนินการของ 06 ในเดือนนั้น</text><text x="1120" y="350.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">เดือนถัดไป ระบบดึงร้านเข้ามาใหม่อัตโนมัติ พร้อมเจ้าของงานคนเดิม</text><path d="M1120,370 L1120,438 L300,438 L300,470" fill="none" stroke="#f59e0b" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#ara)"/><rect x="644.0" y="418" width="132.0" height="16" rx="8" fill="#ffffff" opacity="0.95"/><text x="710" y="429" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#b45309" font-weight="600">เข้าคิวรอบเดือนถัดไป</text><rect x="150.0" y="470.0" width="300" height="84" rx="12" fill="#eef4ff" stroke="#2f6fed" stroke-width="1.7" filter="url(#sh)"/><text x="316" y="508.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="13.5" fill="#1f2937" font-weight="700">งานรอบเดือนถัดไป</text><text x="316" y="525.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">ร้านเดิม · เจ้าของงานคนเดิม</text><circle cx="176.0" cy="512" r="15" fill="#2f6fed"/><text x="176.0" y="516.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#fff" font-weight="700">06</text><rect x="520.0" y="470.0" width="840" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7" filter="url(#sh)"/><text x="940" y="511.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="13.5" fill="#1f2937" font-weight="700">วิธี resolve “เจ้าของงานคนเดิม” (ไม่มีคอลัมน์ assignee ในตารางของ SGI)</text><text x="940" y="528.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">1 · หาเอกสารรอบก่อนหน้าของร้านเดียวกัน (impacted_store_code เดิม · round_no/loop_no ก่อนหน้า)</text><text x="940" y="543.0" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">2 · อ่าน sgi_consideration_logs แถวล่าสุดที่ section_code = ขั้นที่จะมอบหมาย  →  consider_by</text><text x="940" y="557.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">3 · ผูกด้วย addPreApprover(versionId, referenceId, stateId, approver, seq) ของ @srm/glb-workflow</text><text x="940" y="572.0" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">4 · Fallback: รอบก่อนไม่เคยผ่านขั้นนั้น / พนักงานลาออก → มอบหมายตาม group ของ auth-backend</text><text x="940" y="586.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">5 · พนักงานลาออกยังต้องเปิด SR เพื่อแก้ชื่อผู้ดำเนินการ (SDD สไลด์ 48)</text><path d="M450,512 L520,512" fill="none" stroke="#7c3aed" stroke-width="1.9" marker-end="url(#arv)"/></g></svg>