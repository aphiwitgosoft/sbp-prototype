.5" fill="#fff" font-weight="700">01</text><rect x="900.0" y="149.0" width="250" height="82" rx="10" fill="#fff2e8" stroke="#ea580c" stroke-width="1.7" filter="url(#sh)"/><text x="1041" y="186.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="13.5" fill="#1f2937" font-weight="700">รอ GM ส่งเสริมธุรกิจ SBP</text><text x="1041" y="203.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">ดำเนินการ</text><circle cx="926.0" cy="190" r="15" fill="#ea580c"/><text x="926.0" y="194.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#fff" font-weight="700">02</text><rect x="1185.0" y="149.0" width="250" height="82" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.7" filter="url(#sh)"/><text x="1326" y="186.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="13.5" fill="#1f2937" font-weight="700">รอผู้บริหารสำนักบริหาร SBP</text><text x="1326" y="203.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.2" fill="#64748b" font-weight="400">ดำเนินการ</text><circle cx="1211.0" cy="190" r="15" fill="#4f46e5"/><text x="1211.0" y="194.5" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#fff" font-weight="700">03</text><rect x="1545.0" y="157.0" width="230" height="66" rx="33.0" fill="#eafaf0" stroke="#16a34a" stroke-width="1.7" filter="url(#sh)"/><text x="1660" y="187" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="12.5" fill="#16a34a" font-weight="700">เสร็จสิ้นดำเนินการ</text><text x="1660" y="202" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="12.5" fill="#16a34a" font-weight="700">(End)</text><path d="M295,190 L330,190" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#arg)"/><path d="M580,190 L615,190" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#arg)"/><path d="M865,190 L900,190" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#arg)"/><path d="M1150,190 L1185,190" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#arg)"/><path d="M1435,190 L1545,190" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#arg)"/><path d="M455,231 L455,278 L170,278 L170,231" fill="none" stroke="#f59e0b" stroke-width="1.9" stroke-dasharray="6 5" marker-end="url(#ara)"/><path d="M740,231 L740,278 L170,278 L170,231" fill="none" stroke="#f59e0b" stroke-width="1.9" stroke-dasharray="6 5" marker-end="url(#ara)"/><path d="M1025,231 L1025,278 L740,278 L740,231" fill="none" stroke="#f59e0b" stroke-width="1.9" stroke-dasharray="6 5" marker-end="url(#ara)"/><path d="M1310,231 L1310,278 L1025,278 L1025,231" fill="none" stroke="#f59e0b" stroke-width="1.9" stroke-dasharray="6 5" marker-end="url(#ara)"/><text x="330" y="296" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11" fill="#b45309" font-weight="600">08 / 01 ส่งกลับ → 06</text><text x="884" y="296" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11" fill="#b45309" font-weight="600">02 ส่งกลับ → 01</text><text x="1168" y="296" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11" fill="#b45309" font-weight="600">AVP ส่งกลับ → 02</text><path d="M170,149 L170,108 L1660,108 L1660,157" fill="none" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M740,149 L740,108 L1660,108 L1660,157" fill="none" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M1025,149 L1025,108 L1660,108 L1660,157" fill="none" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="537.0" y="89" width="726.0" height="16" rx="8" fill="#ffffff" opacity="0.95"/><text x="900" y="100" text-anchor="middle" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#dc2626" font-weight="600">เห็นควรไม่ชดเชย (06 · 01 · 02) และ หยุดชดเชยประกันรายได้ (06) → เสร็จสิ้นทันที  ·  02 ยอด &lt; 100,000 อนุมัติแล้วจบที่ GM</text><rect x="60" y="340" width="1720" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="78" y="366" text-anchor="start" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="12.5" fill="#1f2937" font-weight="700">อีเมลแจ้งเตือน และข้อควรระวัง</text><text x="78" y="388" text-anchor="start" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#475569" font-weight="400">• เปลี่ยนสถานะ → SBPGI เรียก sendEmail() ของ email-lib เอง โดยใช้เลข template จาก sps_store.workflow_route.email_id (ปิด DP-5 · ไม่มีตาราง status_email_rules)</text><text x="78" y="408" text-anchor="start" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#475569" font-weight="400">• เตือนงานค้างทุกวันจันทร์ 10:00 น. · escalation เมื่อค้างครบ 30 / 45 / 60 วัน → หัวหน้า Section (เลข template เก็บที่ mas_param)</text><text x="78" y="428" text-anchor="start" font-family="Tahoma,'Segoe UI','Noto Sans Thai',sans-serif" font-size="11.5" fill="#475569" font-weight="400">• สถานะเอกสารมี 6 ค่าเท่านั้น — “หยุดชดเชยประกันรายได้” เป็น ผลการพิจารณา ไม่ใช่สถานะที่ 7 (คัดจาก consideration_logs · FE แสดงเป็นชิป ↺ หยุดชดเชยฯ)</text></g></svg>